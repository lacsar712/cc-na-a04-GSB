{% extends "base.html" %}
{% block title %}走低门槛{% endblock %}
{% block body %}
<h1>走低门槛</h1>
{% if error %}<p class="err">{{ error }}</p>{% endif %}
<p>当前门槛：比上一笔低出 <strong>{{ current.drop_cd }}</strong> 坎德拉算走低（{{ current.updated_by }} 设定）。</p>
<form class="card" method="post">
  {% csrf_token %}
  <label>新门槛（坎德拉）</label>
  <input name="drop_cd" type="number" step="0.1" min="0" value="{{ current.drop_cd }}" />
  <button type="submit">保存门槛</button>
</form>
<p>改门槛只影响以后的判定；事件册里旧事件的门槛与差额保持原文不动。</p>
{% endblock %}
